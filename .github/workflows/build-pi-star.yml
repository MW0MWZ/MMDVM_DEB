name: Build Pi-Star DEB

# Triggered exclusively by Pi-Star_MCP release workflow
on:
  repository_dispatch:
    types: [build-pi-star]

concurrency:
  group: build-pi-star
  cancel-in-progress: false

jobs:
  build:
    name: Build pi-star for ${{ matrix.arch }} on Debian ${{ matrix.debian_version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, armhf, arm64]
        debian_version: [bookworm, trixie]
        include:
          - arch: amd64
            platform: linux/amd64
            binary: pistar-mcp-linux-amd64
          - arch: armhf
            platform: linux/arm/v7
            binary: pistar-mcp-linux-arm
          - arch: arm64
            platform: linux/arm64
            binary: pistar-mcp-linux-arm64
          - debian_version: bookworm
            debian_tag: '12'
          - debian_version: trixie
            debian_tag: '13'
      fail-fast: false
      max-parallel: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout gh-pages for version checking
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-check
        continue-on-error: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download release assets from Pi-Star_MCP
        env:
          GH_TOKEN: ${{ secrets.PISTAR_MCP_TOKEN }}
        run: |
          set -e
          VERSION="${{ github.event.client_payload.version }}"
          REPO="${{ github.event.client_payload.repo }}"
          TAG="${{ github.event.client_payload.tag }}"

          echo "Downloading Pi-Star MCP $VERSION from $REPO"

          mkdir -p release-assets
          cd release-assets

          # Download the binary for this architecture
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "${{ matrix.binary }}"

          # Download Debian packaging files
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "packaging-debian.tar.gz"

          # Also download Alpine packaging (for example config)
          gh release download "$TAG" \
            --repo "$REPO" \
            --pattern "packaging-alpine.tar.gz"

          # Extract packaging files
          tar xzf packaging-debian.tar.gz
          tar xzf packaging-alpine.tar.gz
          rm -f packaging-debian.tar.gz packaging-alpine.tar.gz

          ls -la

      - name: Determine build number
        id: buildnum
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          RELEASE="${{ github.event.client_payload.release }}"

          # Use release number from dispatch payload (from tag YYYY.MM.DD.RR)
          # Fall back to auto-increment if not provided (backwards compatibility)
          if [ -n "$RELEASE" ]; then
            BUILD_NUMBER="$RELEASE"
          else
            BUILD_NUMBER="1"

            # Check existing packages in gh-pages
            for CHECK_VERSION in bookworm trixie; do
              for CHECK_ARCH in amd64 armhf arm64; do
                GH_DIR="gh-pages-check/pool/main/p/pi-star"
                if [ -d "$GH_DIR" ]; then
                  EXISTING=$(ls -1 "$GH_DIR/pi-star_${VERSION}-"*"_${CHECK_ARCH}.deb" 2>/dev/null | sort -V || true)
                  if [ -n "$EXISTING" ]; then
                    for PKG_FILE in $EXISTING; do
                      NUM=$(echo "$PKG_FILE" | sed -n "s/.*_${VERSION}-\([0-9]*\).*/\1/p")
                      if [ -n "$NUM" ] && [ "$NUM" -ge "$BUILD_NUMBER" ]; then
                        BUILD_NUMBER=$((NUM + 1))
                      fi
                    done
                  fi
                fi
              done
            done
          fi

          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Build number: ${BUILD_NUMBER}"

      - name: Build DEB package
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
          DEBIAN_VERSION: ${{ matrix.debian_version }}
          DEBIAN_TAG: ${{ matrix.debian_tag }}
          VERSION: ${{ github.event.client_payload.version }}
          BUILD_NUMBER: ${{ steps.buildnum.outputs.build_number }}
        run: |
          set -e

          OUTPUT_DIR="pool/main/p/pi-star"
          mkdir -p "$OUTPUT_DIR"

          docker run --rm \
            --platform "$PLATFORM" \
            -v "$(pwd)/release-assets:/release:ro" \
            -v "$(pwd)/$OUTPUT_DIR:/output" \
            -e ARCH="$ARCH" \
            -e VERSION="$VERSION" \
            -e BUILD_NUMBER="$BUILD_NUMBER" \
            -e DEBIAN_VERSION="$DEBIAN_VERSION" \
            -e BINARY_PATH="/release/${{ matrix.binary }}" \
            -e OUTPUT_DIR="/output" \
            "debian:${DEBIAN_TAG}" \
            bash -c '
              set -e
              apt-get update
              apt-get install -y fakeroot file

              # Run the build script
              bash /release/debian/build.sh
            '

          echo "Built packages:"
          ls -la "$OUTPUT_DIR"/*.deb 2>/dev/null || echo "No packages found"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pi-star-${{ matrix.debian_version }}-${{ matrix.arch }}
          path: pool/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    if: needs.build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      # Adds the release to gh-pages as it is at the moment of publishing,
      # tidies the whole repository (orphans, old versions, all of dists/
      # written and signed afresh, site files) and never force-pushes: when
      # Build Debian Packages publishes first, this starts again from its
      # commit, so neither release undoes the other.
      - name: Publish to gh-pages
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          scripts/publish-repo.sh gh-pages \
            "pi-star ${{ github.event.client_payload.version }}" \
            scripts/merge-artifacts.sh artifacts/pi-star-*/

      - name: Wait for the live repository, then purge Cloudflare
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ZONE: ${{ secrets.CLOUDFLARE_ZONE }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          SITE: https://deb.pistar.uk
          INDEX_PATHS: dists/bookworm/InRelease dists/bookworm/Release dists/trixie/InRelease dists/trixie/Release dists/bookworm/main/binary-amd64/Packages dists/bookworm/main/binary-amd64/Packages.gz dists/bookworm/main/binary-amd64/Packages.bz2 dists/bookworm/main/binary-arm64/Packages dists/bookworm/main/binary-arm64/Packages.gz dists/bookworm/main/binary-arm64/Packages.bz2 dists/bookworm/main/binary-armhf/Packages dists/bookworm/main/binary-armhf/Packages.gz dists/bookworm/main/binary-armhf/Packages.bz2 dists/trixie/main/binary-amd64/Packages dists/trixie/main/binary-amd64/Packages.gz dists/trixie/main/binary-amd64/Packages.bz2 dists/trixie/main/binary-arm64/Packages dists/trixie/main/binary-arm64/Packages.gz dists/trixie/main/binary-arm64/Packages.bz2 dists/trixie/main/binary-armhf/Packages dists/trixie/main/binary-armhf/Packages.gz dists/trixie/main/binary-armhf/Packages.bz2 hamradio.gpg
        run: |
          # Purging before the GitHub Pages build finishes lets Cloudflare
          # re-cache the old index for hours, so image builds install the
          # previous release.
          scripts/wait-for-pages.sh || \
            echo "::warning::https://deb.pistar.uk is not yet serving the deployed index"

  # Keep the Actions history short (see cleanup-runs.yml)
  cleanup-runs:
    name: Cleanup old workflow runs
    needs: [build, deploy]
    if: always()
    permissions:
      actions: write
    uses: ./.github/workflows/cleanup-runs.yml
